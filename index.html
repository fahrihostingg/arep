<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Arif Fahmi | Official Profile & Luahan Hati</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FontAwesome Icons & Google Fonts -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --primary: #00ffd5;
  --primary-glow: rgba(0, 255, 213, 0.3);
  --bg-dark: #05070f;
  --glass: rgba(15, 23, 42, 0.75);
  --glass-border: rgba(255, 255, 255, 0.12);
  --input-bg: rgba(255, 255, 255, 0.05);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: var(--bg-dark);
  color: #fff;
  overflow-x: hidden;
  padding: 20px 10px;
}

/* BACKGROUND CANVAS ANIMATION */
#canvas-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* MAIN CONTAINER */
.container {
  position: relative;
  width: 100%;
  max-width: 430px;
  z-index: 10;
}

/* STABLE GLASS CARD */
.card {
  background: var(--glass);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 255, 213, 0.08);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(0,255,213,0.05) 0%, transparent 70%);
  pointer-events: none;
}

/* AVATAR HEADER */
.avatar-wrapper {
  position: relative;
  width: 105px;
  height: 105px;
  margin: 0 auto 15px;
}

.avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--primary);
  box-shadow: 0 0 20px var(--primary-glow);
}

.avatar-ring {
  position: absolute;
  top: -6px;
  left: -6px;
  right: -6px;
  bottom: -6px;
  border: 2px dashed rgba(0, 255, 213, 0.4);
  border-radius: 50%;
  animation: spin 15s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

/* TYPOGRAPHY */
h2 {
  font-family: 'Cinzel', serif;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  font-size: 12px;
  color: #a0aec0;
  letter-spacing: 1px;
  margin-top: 4px;
  text-transform: uppercase;
  font-weight: 500;
}

/* SOCIAL ICONS (STABLE TOUCH - NO SHAKING/JUMPING) */
.social {
  margin: 18px 0;
  display: flex;
  justify-content: center;
  gap: 12px;
}

.social a {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  text-decoration: none;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.social a:active, .social a:hover {
  background: var(--primary);
  color: #000;
  border-color: var(--primary);
  box-shadow: 0 0 15px var(--primary-glow);
}

/* NAVIGATION TABS */
.nav {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.nav button {
  flex: 1;
  padding: 10px 6px;
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
  color: #cbd5e1;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}

.nav button:active, .nav button.active {
  background: var(--primary);
  color: #05070f;
  border-color: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow);
}

/* PAGE DISPLAY AREA */
.page {
  margin-top: 18px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 18px;
  border-radius: 16px;
  text-align: center;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* QUOTES GALAU STYLING */
.quote-box {
  width: 100%;
}

.quote-icon {
  font-size: 16px;
  color: var(--primary);
  opacity: 0.6;
  margin-bottom: 6px;
}

.quote-text {
  font-size: 13px;
  line-height: 1.6;
  color: #e2e8f0;
  font-style: italic;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease;
}

.quote-text.fade-out {
  opacity: 0;
}

.quote-text.fade-in {
  opacity: 1;
}

.next-quote-btn {
  margin-top: 8px;
  background: transparent;
  border: none;
  color: var(--primary);
  font-size: 11px;
  cursor: pointer;
  opacity: 0.8;
  padding: 5px 10px;
}

.next-quote-btn:active {
  opacity: 1;
}

/* GUESTBOOK & LUAHAN HATI FORM */
.guestbook-box {
  width: 100%;
  text-align: left;
}

.guestbook-title {
  font-size: 13px;
  color: var(--primary);
  margin-bottom: 2px;
  font-weight: 600;
}

.guestbook-sub {
  font-size: 10.5px;
  color: #a0aec0;
  margin-bottom: 12px;
}

#messageForm input, #messageForm textarea {
  width: 100%;
  background: var(--input-bg);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  padding: 9px 12px;
  color: #fff;
  font-size: 12px;
  margin-bottom: 8px;
  outline: none;
  transition: border-color 0.2s ease;
}

#messageForm input:focus, #messageForm textarea:focus {
  border-color: var(--primary);
}

#messageForm textarea {
  resize: none;
  height: 60px;
}

.submit-btn {
  width: 100%;
  padding: 9px;
  background: var(--primary);
  color: #000;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.2s ease;
}

.submit-btn:active {
  background: #00d6b3;
}

/* LIVE MESSAGES LIST */
.messages-list {
  margin-top: 14px;
  max-height: 200px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 4px;
  width: 100%;
}

.messages-list::-webkit-scrollbar {
  width: 4px;
}
.messages-list::-webkit-scrollbar-thumb {
  background: rgba(0, 255, 213, 0.3);
  border-radius: 4px;
}

.msg-card {
  background: rgba(255, 255, 255, 0.03);
  border-left: 3px solid var(--primary);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 11.5px;
}

.msg-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 3px;
}

.msg-name {
  font-weight: 600;
  color: var(--primary);
}

.msg-time {
  font-size: 9.5px;
  color: #718096;
}

.msg-body {
  color: #cbd5e1;
  line-height: 1.4;
  word-break: break-word;
}

.loading-msg {
  font-size: 11px;
  color: #888;
  text-align: center;
  width: 100%;
}

/* CONTACT LIST */
.contact-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 10px 12px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 12px;
  border: 1px solid var(--glass-border);
}

.contact-item i {
  color: var(--primary);
}

/* MUSIC PLAYER CONTROL */
.music-card {
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--glass-border);
  padding: 10px 15px;
  border-radius: 16px;
}

.music-info {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
}

.music-disc {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #111;
  border: 2px solid var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--primary);
}

.music-disc.playing {
  animation: spin 4s linear infinite;
}

.music-title {
  font-size: 11.5px;
  font-weight: 600;
  color: #fff;
}

.music-sub {
  font-size: 9.5px;
  color: #888;
}

.music-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--primary);
  color: #000;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  transition: background 0.2s ease;
}

.music-btn:active {
  background: #00d6b3;
}

</style>
</head>

<body onclick="autoStartAudio()">

<!-- Canvas Background -->
<canvas id="canvas-bg"></canvas>

<div class="container">
  <div class="card">

    <!-- Avatar Header -->
    <div class="avatar-wrapper">
      <div class="avatar-ring"></div>
      <img class="avatar" src="https://telegra.ph/file/91f95074f25269deb0dc7.jpg" alt="Arif Fahmi" onerror="this.src='https://i.postimg.cc/mD3qP4XN/avatar-placeholder.jpg'">
    </div>

    <h2>ARIF FAHMI</h2>
    <p class="subtitle">Arep Galau • Digital Creator</p>

    <!-- Social Links -->
    <div class="social">
      <a href="https://wa.me/601172590364" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
      <a href="https://instagram.com/rulshz" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://github.com/fahrihostingg" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
      <a href="https://youtube.com/@rulshz" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
    </div>

    <!-- Navigation -->
    <div class="nav">
      <button id="btn-home" class="active" onclick="switchPage('home')">HOME</button>
      <button id="btn-quotes" onclick="switchPage('quotes')">QUOTES</button>
      <button id="btn-guestbook" onclick="switchPage('guestbook')">LUAHAN</button>
      <button id="btn-contact" onclick="switchPage('contact')">CONTACT</button>
    </div>

    <!-- Dynamic Content Area -->
    <div id="content"></div>

    <!-- Audio Player -->
    <div class="music-card">
      <div class="music-info">
        <div class="music-disc" id="musicDisc">
          <i class="fas fa-music"></i>
        </div>
        <div>
          <div class="music-title">Sad Vibe Audio</div>
          <div class="music-sub" id="musicStatus">Klik untuk mainkan</div>
        </div>
      </div>
      <button class="music-btn" onclick="toggleMusic(event)">
        <i class="fas fa-play" id="playIcon"></i>
      </button>
    </div>

  </div>
</div>

<audio id="music" loop>
  <source src="https://storage.neko.pe/file/Pd8lNw~74AgVto~G9FWo.mp3" type="audio/mp3">
</audio>

<script>
/* ===================================================
   1. RANDOM QUOTES GALAU SYSTEM (DELAY 7 SAAT)
   =================================================== */
const quotesGalau = [
  "Tetaplah tersenyum walaupun hati sedang hancur lebur.",
  "Kadang kita kuat bukan sebab tak sakit, tapi sebab dah terlalu biasa menahan.",
  "Ada rindu yang tak pernah sampai, tapi tetap setia tinggal di dalam hati.",
  "Yang paling sakit bukan kehilangan, tapi kenangan yang enggan menghilang.",
  "Aku berpura-pura tidak peduli, padahal dalam diam aku selalu memperhatikanmu.",
  "Lucu ya, dulu kita saling menyapa setiap hari, sekarang seperti tak pernah saling kenal.",
  "Mungkin aku hanya ditakdirkan untuk menemani, bukan untuk memiliki.",
  "Jangan terlalu berharap pada manusia, kecewanya takkan pernah ada penawar.",
  "Aku tetap mendoakan kebahagiaanmu, walaupun kebahagiaan itu bukan lagi bersamaku.",
  "Sakit yang paling dalam adalah ketika kamu tersenyum hanya untuk menahan air mata.",
  "Ternyata memaafkan itu mudah, yang sulit adalah mengembalikan rasa percaya yang telah hilang."
];

let currentQuoteIndex = 0;
let quoteInterval = null;

function getRandomQuote() {
  let newIndex;
  do {
    newIndex = Math.floor(Math.random() * quotesGalau.length);
  } while (newIndex === currentQuoteIndex && quotesGalau.length > 1);
  
  currentQuoteIndex = newIndex;
  return quotesGalau[currentQuoteIndex];
}

function updateQuoteDisplay() {
  const quoteEl = document.getElementById("quoteText");
  if (!quoteEl) return;
  
  quoteEl.classList.add("fade-out");
  
  setTimeout(() => {
    quoteEl.textContent = `"${getRandomQuote()}"`;
    quoteEl.classList.remove("fade-out");
    quoteEl.classList.add("fade-in");
  }, 600);
}

function startQuoteRotation() {
  stopQuoteRotation();
  // Delay 7000ms (7 Saat) supaya pelawat sempat membaca
  quoteInterval = setInterval(updateQuoteDisplay, 7000);
}

function stopQuoteRotation() {
  if (quoteInterval) clearInterval(quoteInterval);
}


/* ===================================================
   2. GUESTBOOK / LUAHAN HATI LIVE API (JSON POLLING)
   =================================================== */
const API_URL = 'api.php';
let pollingInterval = null;

async function fetchMessages() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) return;
    const data = await res.json();
    
    const listEl = document.getElementById('messagesList');
    if (!listEl) return;
    
    if (!Array.isArray(data) || data.length === 0) {
      listEl.innerHTML = '<p class="loading-msg">Belum ada luahan. Jadilah yang pertama!</p>';
      return;
    }
    
    listEl.innerHTML = data.map(msg => `
      <div class="msg-card">
        <div class="msg-header">
          <span class="msg-name">${msg.name || 'Anon Galau'}</span>
          <span class="msg-time">${msg.time || ''}</span>
        </div>
        <div class="msg-body">${msg.message}</div>
      </div>
    `).join('');

  } catch (err) {
    console.error('Gagal mengambil pesan:', err);
  }
}

async function sendMessage(e) {
  e.preventDefault();
  
  const nameInput = document.getElementById('senderName');
  const msgInput = document.getElementById('senderMsg');
  const btn = document.getElementById('submitBtn');
  
  if (!msgInput) return;
  
  const name = nameInput.value.trim();
  const message = msgInput.value.trim();
  
  if (!message) return;
  
  btn.disabled = true;
  btn.innerText = 'Mengirim...';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, message })
    });

    const result = await res.json();
    
    if (result.status === 'success') {
      msgInput.value = '';
      nameInput.value = '';
      fetchMessages();
    } else {
      alert(result.message || 'Gagal menghantar mesej.');
    }
  } catch (err) {
    alert('Ralat sambungan server.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Hantar Luahan';
  }
}

function startPollingMessages() {
  stopPollingMessages();
  fetchMessages();
  pollingInterval = setInterval(fetchMessages, 3000); // Live update setiap 3 saat
}

function stopPollingMessages() {
  if (pollingInterval) clearInterval(pollingInterval);
}


/* ===================================================
   3. SPA ROUTER PAGE SWITCHER
   =================================================== */
function switchPage(page) {
  const content = document.getElementById("content");
  
  // Navigation active state
  document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.getElementById(`btn-${page}`);
  if (activeBtn) activeBtn.classList.add('active');

  stopQuoteRotation();
  stopPollingMessages();

  if (page === 'home' || page === 'quotes') {
    content.innerHTML = `
      <div class="page">
        <div class="quote-box">
          <div class="quote-icon"><i class="fas fa-quote-left"></i></div>
          <p id="quoteText" class="quote-text">"${getRandomQuote()}"</p>
          <button class="next-quote-btn" onclick="updateQuoteDisplay()"><i class="fas fa-random"></i> Tukar Quote</button>
        </div>
      </div>`;
    startQuoteRotation();

  } else if (page === 'guestbook') {
    content.innerHTML = `
      <div class="page">
        <div class="guestbook-box">
          <div class="guestbook-title"><i class="fas fa-envelope-open-text"></i> Luahan Hati Anonim</div>
          <div class="guestbook-sub">Tulis sesuatu... Terus muncul live di semua peranti!</div>

          <form id="messageForm" onsubmit="sendMessage(event)">
            <input type="text" id="senderName" placeholder="Nama / Anonim (Opsional)" maxlength="20">
            <textarea id="senderMsg" placeholder="Luahkan isi hati anda di sini..." required maxlength="250"></textarea>
            <button type="submit" class="submit-btn" id="submitBtn"><i class="fas fa-paper-plane"></i> Hantar Luahan</button>
          </form>

          <div class="messages-list" id="messagesList">
            <p class="loading-msg">Memuatkan luahan hati...</p>
          </div>
        </div>
      </div>`;
    startPollingMessages();

  } else if (page === 'contact') {
    content.innerHTML = `
      <div class="page" style="width: 100%;">
        <div class="contact-item">
          <span><i class="fab fa-whatsapp"></i> WhatsApp</span>
          <strong>01172590364</strong>
        </div>
        <div class="contact-item">
          <span><i class="fab fa-instagram"></i> Instagram</span>
          <strong>@rulshz</strong>
        </div>
        <div class="contact-item">
          <span><i class="fab fa-github"></i> GitHub</span>
          <strong>fahrihostingg</strong>
        </div>
      </div>`;
  }
}

// Default page load
switchPage('home');


/* ===================================================
   4. AUDIO PLAYER CONTROL SYSTEM
   =================================================== */
const music = document.getElementById("music");
const playIcon = document.getElementById("playIcon");
const musicDisc = document.getElementById("musicDisc");
const musicStatus = document.getElementById("musicStatus");
let audioStarted = false;

function autoStartAudio() {
  if (!audioStarted) {
    music.play().then(() => {
      audioStarted = true;
      updateAudioUI(true);
    }).catch(() => {});
  }
}

function toggleMusic(e) {
  if (e) e.stopPropagation();
  if (music.paused) {
    music.play();
    audioStarted = true;
    updateAudioUI(true);
  } else {
    music.pause();
    updateAudioUI(false);
  }
}

function updateAudioUI(isPlaying) {
  if (isPlaying) {
    playIcon.className = "fas fa-pause";
    musicDisc.classList.add("playing");
    musicStatus.textContent = "Sedang Dimainkan...";
  } else {
    playIcon.className = "fas fa-play";
    musicDisc.classList.remove("playing");
    musicStatus.textContent = "Dipause";
  }
}


/* ===================================================
   5. CANVAS STAR PARTICLES BACKGROUND
   =================================================== */
const canvas = document.getElementById('canvas-bg');
const ctx = canvas.getContext('2d');
let stars = [];
const numStars = 100;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Star {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 1.5 + 0.5;
    this.opacity = Math.random() * 0.7 + 0.3;
    this.speed = Math.random() * 0.5 + 0.2;
  }
  update() {
    this.y -= this.speed;
    if (this.y < 0) {
      this.y = canvas.height;
      this.x = Math.random() * canvas.width;
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 255, 213, ${this.opacity})`;
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#00ffd5';
    ctx.fill();
  }
}

for (let i = 0; i < numStars; i++) {
  stars.push(new Star());
}

function animateStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(star => {
    star.update();
    star.draw();
  });
  requestAnimationFrame(animateStars);
}

animateStars();

</script>
</body>
</html>
